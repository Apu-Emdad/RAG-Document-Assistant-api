name: rag-document-assistant

# No restart policy, so nothing starts by itself when the laptop boots.
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: rag-document-assistant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: rag-document-assistant-ollama
    ports:
      - '11434:11434'
    # Keeps downloaded models when the container is stopped or removed
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  ollama-data:
